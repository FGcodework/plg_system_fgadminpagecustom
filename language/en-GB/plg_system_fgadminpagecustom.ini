; plg_system_fgadminpagecustom 1.0.0 - en-GB
PLG_SYSTEM_FGADMINPAGECUSTOM="System - FG Admin Page Customizer"
PLG_SYSTEM_FGADMINPAGECUSTOM_XML_DESCRIPTION="DEPRECATED: this plugin is no longer developed and is replaced by FG Admin Customizer (plg_system_fgadmincustom), which takes over its settings. Restyles the logged-in administrator (Atum template) from one brand color, with custom header logos and corner radius and shadow presets. Joomla 5 and 6. For the login page use FG Admin Login Customizer."
PLG_SYSTEM_FGADMINPAGECUSTOM_FIELDSET_BRANDING="Brand & Logo"
PLG_SYSTEM_FGADMINPAGECUSTOM_FIELDSET_SHAPE="Shape"
PLG_SYSTEM_FGADMINPAGECUSTOM_FIELDSET_BEHAVIOR="Behavior"
PLG_SYSTEM_FGADMINPAGECUSTOM_MENU_OPEN_FIRST_LABEL="Open first submenu item"
PLG_SYSTEM_FGADMINPAGECUSTOM_MENU_OPEN_FIRST_DESC="Clicking a component in the Components menu opens its first submenu item directly (as in Joomla 3.10) instead of only expanding the submenu. Works in the Atum sidebar and in the Phoca Top Menu module. Touch devices keep the expand behaviour."
PLG_SYSTEM_FGADMINPAGECUSTOM_FIELDSET_IMPORTEXPORT="Export / Import"
PLG_SYSTEM_FGADMINPAGECUSTOM_BRAND_COLOR_LABEL="Brand color"
PLG_SYSTEM_FGADMINPAGECUSTOM_BRAND_COLOR_DESC="One color for the administrator. It sets the header bar, the highlights in the sidebar menu, the primary buttons, the links (in the light color scheme, where the color is readable on white) and the focus ring of form fields. Text colors on top of it are calculated automatically. Leave empty to keep the Atum colors."
PLG_SYSTEM_FGADMINPAGECUSTOM_HEADER_COLOR_LABEL="Header color"
PLG_SYSTEM_FGADMINPAGECUSTOM_HEADER_COLOR_DESC="Color of the top bar. Leave empty to use the brand color."
PLG_SYSTEM_FGADMINPAGECUSTOM_SIDEBAR_FOLLOW_LABEL="Sidebar follows header"
PLG_SYSTEM_FGADMINPAGECUSTOM_SIDEBAR_FOLLOW_DESC="Colors the sidebar menu like the header when no sidebar color is set. Turn off to keep the Atum sidebar."
PLG_SYSTEM_FGADMINPAGECUSTOM_SIDEBAR_COLOR_LABEL="Sidebar color"
PLG_SYSTEM_FGADMINPAGECUSTOM_SIDEBAR_COLOR_DESC="Background of the sidebar menu. Text on it is switched to dark automatically when the color is light. Leave empty to keep the Atum sidebar."
PLG_SYSTEM_FGADMINPAGECUSTOM_PAGE_BG_LABEL="Page background"
PLG_SYSTEM_FGADMINPAGECUSTOM_PAGE_BG_DESC="Background of the administrator pages in the light color scheme. Leave empty to keep the Atum background."
PLG_SYSTEM_FGADMINPAGECUSTOM_LOGO_LABEL="Header logo"
PLG_SYSTEM_FGADMINPAGECUSTOM_LOGO_DESC="Replaces the Joomla logo in the header bar (shown while the sidebar menu is expanded). Use a logo that reads well on your brand color."
PLG_SYSTEM_FGADMINPAGECUSTOM_LOGO_SMALL_LABEL="Header logo - small"
PLG_SYSTEM_FGADMINPAGECUSTOM_LOGO_SMALL_DESC="Optional. Replaces the small square logo shown while the sidebar menu is collapsed. Leave empty to keep the template's own."
PLG_SYSTEM_FGADMINPAGECUSTOM_LOGO_HEIGHT_LABEL="Header logo height (px)"
PLG_SYSTEM_FGADMINPAGECUSTOM_LOGO_HEIGHT_DESC="Optional fixed height of the header logos (16-120). Leave empty to keep the template's size."
PLG_SYSTEM_FGADMINPAGECUSTOM_CTRL_RADIUS_LABEL="Fields and buttons border radius (px)"
PLG_SYSTEM_FGADMINPAGECUSTOM_CTRL_RADIUS_DESC="Rounds the corners of buttons and form fields. Grouped fields and buttons keep a flat joint. Leave empty to keep the template default."
PLG_SYSTEM_FGADMINPAGECUSTOM_CARD_RADIUS_LABEL="Panels border radius (px)"
PLG_SYSTEM_FGADMINPAGECUSTOM_CARD_RADIUS_DESC="Rounds the corners of cards, option panels, dropdown menus and dialogs. Leave empty to keep the template default."
PLG_SYSTEM_FGADMINPAGECUSTOM_BTN_SHADOW_LABEL="Primary button shadow"
PLG_SYSTEM_FGADMINPAGECUSTOM_BTN_SHADOW_DESC="Adds depth below the primary buttons."
PLG_SYSTEM_FGADMINPAGECUSTOM_CARD_SHADOW_LABEL="Card shadow"
PLG_SYSTEM_FGADMINPAGECUSTOM_CARD_SHADOW_DESC="Adds depth below cards (for example the dashboard panels)."
PLG_SYSTEM_FGADMINPAGECUSTOM_SHADOW_NONE="None"
PLG_SYSTEM_FGADMINPAGECUSTOM_SHADOW_SUBTLE="Subtle"
PLG_SYSTEM_FGADMINPAGECUSTOM_SHADOW_MEDIUM="Medium"
PLG_SYSTEM_FGADMINPAGECUSTOM_SHADOW_STRONG="Strong"
PLG_SYSTEM_FGADMINPAGECUSTOM_EXPORT_JSON_LABEL="Export (current settings)"
PLG_SYSTEM_FGADMINPAGECUSTOM_EXPORT_JSON_DESC="Read-only. Copy this JSON to transfer the settings to another site's copy of this plugin (paste it into the Import field there). Logo paths are copied as text - the image files must exist at the same path on the other site."
PLG_SYSTEM_FGADMINPAGECUSTOM_IMPORT_JSON_LABEL="Import"
PLG_SYSTEM_FGADMINPAGECUSTOM_IMPORT_JSON_DESC="Paste JSON exported from another site and click Save. The fields refresh with the imported values on this same screen - review them and click Save once more to apply. This field clears itself after use."
PLG_SYSTEM_FGADMINPAGECUSTOM_IMPORT_APPLIED="Import applied to the fields - review and click Save again to store them."
PLG_SYSTEM_FGADMINPAGECUSTOM_IMPORT_INVALID_JSON="The pasted Import text is not valid JSON - nothing was changed."
PLG_SYSTEM_FGADMINPAGECUSTOM_SAFE_MODE_ACTIVE="FG Admin Page Customizer is switched off for this session. Open any administrator page with ?fgapc=on added to the address to switch it back on."
PLG_SYSTEM_FGADMINPAGECUSTOM_FIELD_SUPPORT_DESC="<div class='alert alert-warning mb-3'><strong>This plugin is deprecated.</strong> It is replaced by <a href='https://github.com/FGcodework/plg_system_fgadmincustom' target='_blank' rel='noopener'>FG Admin Customizer</a>, which takes over the settings of this plugin. No further updates will be released.</div><style>a.fg-kofi[target='_blank']::before{content:none;padding:0}</style><div class='mb-3'><strong>This plugin is free and open source.</strong> If it has saved you time, a one-off tip on Ko-fi is welcome but entirely optional - no feature here is ever locked behind a paywall.</div><div class='d-flex align-items-center gap-3'><a href='https://ko-fi.com/fgcodework' target='_blank' rel='noopener noreferrer' class='fg-kofi'><img src='https://storage.ko-fi.com/cdn/kofi3.png?v=4' alt='ko-fi' width='180'></a><a href='https://fgcodework.github.io/' target='_blank' rel='noopener noreferrer' class='btn' style='--btn-color:var(--atum-btn);--btn-bg:var(--atum-btn-bg);--btn-border-color:hsl(var(--hue),20%,80%);--btn-hover-color:var(--atum-btn-hvr);--btn-hover-bg:var(--atum-btn-bg-hvr);--btn-hover-border-color:var(--atum-btn-bg-hvr);--btn-active-color:var(--atum-btn-hvr);--btn-active-bg:var(--atum-btn-bg-hvr);--btn-active-border-color:var(--atum-btn-bg-hvr)'>More FG Extensions</a></div>"
