; plg_system_fgadminpagecustom 1.0.0 - sk-SK
PLG_SYSTEM_FGADMINPAGECUSTOM="System - FG Admin Page Customizer"
PLG_SYSTEM_FGADMINPAGECUSTOM_XML_DESCRIPTION="ZASTARANÉ: tento plugin sa už nevyvíja a nahradil ho FG Admin Customizer (plg_system_fgadmincustom), ktorý preberá jeho nastavenia. Prefarbí prihlásenú administráciu (šablóna Atum) jednou farbou značky, vlastnými logami v hlavičke a zaoblením a tieňmi prvkov. Joomla 5 a 6. Pre prihlasovaciu stránku použi FG Admin Login Customizer."
PLG_SYSTEM_FGADMINPAGECUSTOM_FIELDSET_BRANDING="Značka a logo"
PLG_SYSTEM_FGADMINPAGECUSTOM_FIELDSET_SHAPE="Tvar"
PLG_SYSTEM_FGADMINPAGECUSTOM_FIELDSET_BEHAVIOR="Správanie"
PLG_SYSTEM_FGADMINPAGECUSTOM_MENU_OPEN_FIRST_LABEL="Otvoriť prvú podpoložku"
PLG_SYSTEM_FGADMINPAGECUSTOM_MENU_OPEN_FIRST_DESC="Kliknutie na komponent v menu Komponenty hneď otvorí jeho prvú podpoložku (ako v Joomla 3.10), namiesto len rozbalenia podmenu. Funguje v bočnom menu Atum aj v module Phoca Top Menu. Na dotykových zariadeniach zostáva rozbalenie."
PLG_SYSTEM_FGADMINPAGECUSTOM_FIELDSET_IMPORTEXPORT="Export / Import"
PLG_SYSTEM_FGADMINPAGECUSTOM_BRAND_COLOR_LABEL="Farba značky"
PLG_SYSTEM_FGADMINPAGECUSTOM_BRAND_COLOR_DESC="Jedna farba pre administráciu. Nastaví horný pás, zvýraznenia v bočnom menu, primárne tlačidlá, odkazy (vo svetlej farebnej schéme, kde je farba čitateľná na bielej) a orámovanie aktívneho poľa. Farby textu na nej sa vypočítajú automaticky. Ak ostane prázdne, ponechajú sa farby Atum."
PLG_SYSTEM_FGADMINPAGECUSTOM_HEADER_COLOR_LABEL="Farba hlavičky"
PLG_SYSTEM_FGADMINPAGECUSTOM_HEADER_COLOR_DESC="Farba horného pásu. Ak ostane prázdne, použije sa farba značky."
PLG_SYSTEM_FGADMINPAGECUSTOM_SIDEBAR_FOLLOW_LABEL="Sidebar podľa hlavičky"
PLG_SYSTEM_FGADMINPAGECUSTOM_SIDEBAR_FOLLOW_DESC="Ak nie je nastavená farba bočného panela, zafarbí ho rovnako ako hlavičku. Vypni, ak chceš ponechať sidebar Atum."
PLG_SYSTEM_FGADMINPAGECUSTOM_SIDEBAR_COLOR_LABEL="Farba bočného panela"
PLG_SYSTEM_FGADMINPAGECUSTOM_SIDEBAR_COLOR_DESC="Pozadie bočného menu. Text na ňom sa automaticky prepne na tmavý, ak je farba svetlá. Ak ostane prázdne, ponechá sa sidebar Atum."
PLG_SYSTEM_FGADMINPAGECUSTOM_PAGE_BG_LABEL="Pozadie stránky"
PLG_SYSTEM_FGADMINPAGECUSTOM_PAGE_BG_DESC="Pozadie stránok administrácie vo svetlej farebnej schéme. Ak ostane prázdne, ponechá sa pozadie Atum."
PLG_SYSTEM_FGADMINPAGECUSTOM_LOGO_LABEL="Logo v hlavičke"
PLG_SYSTEM_FGADMINPAGECUSTOM_LOGO_DESC="Nahradí logo Joomla v hornom páse (zobrazené pri rozbalenom bočnom menu). Použi logo, ktoré je dobre čitateľné na farbe značky."
PLG_SYSTEM_FGADMINPAGECUSTOM_LOGO_SMALL_LABEL="Logo v hlavičke - malé"
PLG_SYSTEM_FGADMINPAGECUSTOM_LOGO_SMALL_DESC="Voliteľné. Nahradí malé štvorcové logo zobrazené pri zbalenom bočnom menu. Ak ostane prázdne, ponechá sa logo šablóny."
PLG_SYSTEM_FGADMINPAGECUSTOM_LOGO_HEIGHT_LABEL="Výška loga v hlavičke (px)"
PLG_SYSTEM_FGADMINPAGECUSTOM_LOGO_HEIGHT_DESC="Voliteľná pevná výška log v hlavičke (16-120). Ak ostane prázdne, ponechá sa veľkosť šablóny."
PLG_SYSTEM_FGADMINPAGECUSTOM_CTRL_RADIUS_LABEL="Zaoblenie polí a tlačidiel (px)"
PLG_SYSTEM_FGADMINPAGECUSTOM_CTRL_RADIUS_DESC="Zaoblí rohy tlačidiel a polí formulára. Zoskupené polia a tlačidlá majú spoj rovný. Ak ostane prázdne, ponechá sa predvolené zaoblenie šablóny."
PLG_SYSTEM_FGADMINPAGECUSTOM_CARD_RADIUS_LABEL="Zaoblenie panelov (px)"
PLG_SYSTEM_FGADMINPAGECUSTOM_CARD_RADIUS_DESC="Zaoblí rohy kariet, panelov nastavení, rozbaľovacích ponúk a dialógov. Ak ostane prázdne, ponechá sa predvolené zaoblenie šablóny."
PLG_SYSTEM_FGADMINPAGECUSTOM_BTN_SHADOW_LABEL="Tieň primárnych tlačidiel"
PLG_SYSTEM_FGADMINPAGECUSTOM_BTN_SHADOW_DESC="Pridá primárnym tlačidlám hĺbku."
PLG_SYSTEM_FGADMINPAGECUSTOM_CARD_SHADOW_LABEL="Tieň kariet"
PLG_SYSTEM_FGADMINPAGECUSTOM_CARD_SHADOW_DESC="Pridá kartám hĺbku (napríklad panelom na nástenke)."
PLG_SYSTEM_FGADMINPAGECUSTOM_SHADOW_NONE="Žiadny"
PLG_SYSTEM_FGADMINPAGECUSTOM_SHADOW_SUBTLE="Jemný"
PLG_SYSTEM_FGADMINPAGECUSTOM_SHADOW_MEDIUM="Stredný"
PLG_SYSTEM_FGADMINPAGECUSTOM_SHADOW_STRONG="Silný"
PLG_SYSTEM_FGADMINPAGECUSTOM_EXPORT_JSON_LABEL="Export (aktuálne nastavenia)"
PLG_SYSTEM_FGADMINPAGECUSTOM_EXPORT_JSON_DESC="Iba na čítanie. Skopíruj tento JSON a prenes nastavenia do kópie pluginu na inej stránke (vlož ho tam do poľa Import). Cesty k logám sa kopírujú ako text - súbory obrázkov musia existovať na rovnakej ceste aj na druhej stránke."
PLG_SYSTEM_FGADMINPAGECUSTOM_IMPORT_JSON_LABEL="Import"
PLG_SYSTEM_FGADMINPAGECUSTOM_IMPORT_JSON_DESC="Vlož JSON exportovaný z inej stránky a klikni na Uložiť. Polia sa na tej istej obrazovke obnovia importovanými hodnotami - skontroluj ich a klikni na Uložiť ešte raz, aby sa použili. Toto pole sa po použití samo vyprázdni."
PLG_SYSTEM_FGADMINPAGECUSTOM_IMPORT_APPLIED="Import bol použitý v poliach - skontroluj ich a klikni znova na Uložiť, aby sa uložili."
PLG_SYSTEM_FGADMINPAGECUSTOM_IMPORT_INVALID_JSON="Vložený text pre Import nie je platný JSON - nič sa nezmenilo."
PLG_SYSTEM_FGADMINPAGECUSTOM_SAFE_MODE_ACTIVE="FG Admin Page Customizer je pre túto reláciu vypnutý. Zapneš ho otvorením ľubovoľnej stránky administrácie s pridaným ?fgapc=on v adrese."
PLG_SYSTEM_FGADMINPAGECUSTOM_FIELD_SUPPORT_DESC="<div class='alert alert-warning mb-3'><strong>Tento plugin je zastaraný.</strong> Nahradil ho <a href='https://github.com/FGcodework/plg_system_fgadmincustom' target='_blank' rel='noopener'>FG Admin Customizer</a>, ktorý preberá jeho nastavenia. Ďalšie aktualizácie už nevyjdú.</div><style>a.fg-kofi[target='_blank']::before{content:none;padding:0}</style><div class='mb-3'><strong>Tento plugin je bezplatný a open source.</strong> Ak vám ušetril čas, jednorazový príspevok na Ko-fi je vítaný, no úplne dobrovoľný - žiadna funkcia tu nie je zamknutá za platbou.</div><div class='d-flex align-items-center gap-3'><a href='https://ko-fi.com/fgcodework' target='_blank' rel='noopener noreferrer' class='fg-kofi'><img src='https://storage.ko-fi.com/cdn/kofi3.png?v=4' alt='ko-fi' width='180'></a><a href='https://fgcodework.github.io/' target='_blank' rel='noopener noreferrer' class='btn' style='--btn-color:var(--atum-btn);--btn-bg:var(--atum-btn-bg);--btn-border-color:hsl(var(--hue),20%,80%);--btn-hover-color:var(--atum-btn-hvr);--btn-hover-bg:var(--atum-btn-bg-hvr);--btn-hover-border-color:var(--atum-btn-bg-hvr);--btn-active-color:var(--atum-btn-hvr);--btn-active-bg:var(--atum-btn-bg-hvr);--btn-active-border-color:var(--atum-btn-bg-hvr)'>Ďalšie FG rozšírenia</a></div>"
